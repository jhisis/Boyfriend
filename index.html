<body>
    <img src="images/RAYO MCQUEEN PRINCIPAL.png" id="rayo" class="character">
    <img src="images/SALLY.png" id="sally" class="character">

    <div id="login-box">
        <h2>Radiator Springs</h2>
        <input type="text" id="user" placeholder="Usuario">
        <input type="password" id="pass" placeholder="Contraseña">
        <button onclick="check()">¡Arrancar motor!</button>
    </div>

<div id="dashboard" style="display: none; text-align: center; color: #333; padding: 20px;">
    <div id="pantalla-pregunta">
        <h2 style="font-family: 'Impact', sans-serif; color: #cc0000; font-size: 2rem;">
            ¿Estás dispuesto a recorrer no solo esta corta pista, si no a recorrer tu vida conmigo y perdonarnos las 70 veces 7 que sean necesarias?
        </h2>
        <button onclick="iniciarRecorrido()" style="background: #28a745; border: none; padding: 20px 40px; color: white; font-size: 20px; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 0 #1e7e34;">
            SÍ
        </button>
    </div>

    <div id="contenedor-estaciones" style="display: none;">
        <h1>¡Comienza la Ruta 66!</h1>
        </div>
</div>
    
    <div id="dashboard" style="display: none; text-align: center; color: white;">
        <h1>¡Bienvenido a la Ruta 66!</h1>
        <p>Aquí verás tus 5 estaciones...</p>
        </div>

    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    </head>

    <script src="script.js"></script>
</body>
